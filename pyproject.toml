[project]
name = "findora"
version = "0.1.0"
description = "Findora - AI-powered research assistant: plans searches, searches the web, writes a report, and emails it to you."
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.14.0",
    "markdown>=3.11.3",
    "openai>=2.34.0",
    "openai-agents>=0.15.1",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "ddgs>=9.0.0",
]
